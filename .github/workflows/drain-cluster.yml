name: drain-cluster

# Drains a cluster's remaining PersistentVolumeClaims, deletes any
# type=LoadBalancer Services, and (spoke only) deprovisions Karpenter nodes
# before that cluster's infra is torn down - same four scripts as before
# (.github/scripts/{freeze-argocd,drain-loadbalancers,drain-pvcs,drain-karpenter-nodes}.sh.tpl,
# reused UNCHANGED - all pure kubectl/aws-cli, nothing master-specific),
# just run directly against the connected cluster instead of over SSM.
#
# CHANGED: there's no master instance to check "is SSM online" against
# anymore. Instead this checks whether the EKS cluster still exists and its
# apiserver is reachable at all before attempting anything - same
# resilience goal (a cluster that's already gone, or badly broken, should
# not fail this job, just skip the affected steps and warn), different
# mechanism.
#
# Best-effort throughout, same as before: a stuck PVC or load balancer logs
# a warning rather than failing the job.

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Root directory of the cluster to drain, e.g. live/hub, live/spoke, or live/spoke-2"
        type: string
        required: true
      environment:
        description: "envs/<environment> folder to read backend.hcl + cluster_name from"
        type: string
        required: true
      aws_region:
        type: string
        required: true
      freeze_argocd_namespace:
        description: If set, scales argocd-application-controller and argocd-applicationset-controller to 0 replicas on THIS cluster
        type: string
        default: ""
      has_karpenter:
        description: "If true, runs the Karpenter node-deprovisioning step before terraform destroy"
        type: boolean
        default: true
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  drain:
    name: "drain cluster (${{ inputs.working_directory }}, ${{ inputs.environment }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.0"

      - name: terraform init
        run: terraform init -backend-config="envs/${{ inputs.environment }}/backend.hcl"

      - name: Capture cluster name
        id: cluster
        run: echo "name=$(terraform output -raw cluster_name 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: Check cluster is reachable
        id: reachable
        if: steps.cluster.outputs.name != ''
        run: |
          if aws eks update-kubeconfig --name "${{ steps.cluster.outputs.name }}" --region "${{ inputs.aws_region }}" >/dev/null 2>&1 \
            && kubectl get --raw='/readyz' >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cluster ${{ steps.cluster.outputs.name }} not reachable - skipping drain. \
            CSI-backed EBS volumes and CCM-provisioned load balancers may be orphaned. \
            Check the AWS Console after this run and delete manually if needed."
          fi

      # ── Freeze local ArgoCD (only set by callers whose cluster runs
      #    ArgoCD itself - currently only live/hub) ──────────────────────
      - name: Render and run ArgoCD freeze script
        if: steps.reachable.outputs.ok == 'true' && inputs.freeze_argocd_namespace != ''
        id: freeze_argocd
        continue-on-error: true
        run: |
          sed \
            -e "s|^export KUBECONFIG=.*|# KUBECONFIG left at its default|" \
            -e "s|__ARGOCD_NAMESPACE__|${{ inputs.freeze_argocd_namespace }}|g" \
            ../../.github/scripts/freeze-argocd.sh.tpl > /tmp/freeze-argocd.sh
          chmod +x /tmp/freeze-argocd.sh
          /tmp/freeze-argocd.sh

      - name: Warn if ArgoCD freeze did not complete cleanly
        if: steps.freeze_argocd.outcome == 'failure'
        run: |
          echo "::warning::ArgoCD freeze script failed - selfHeal may still be active during this drain, \
          risking a recreate race against deleted namespaces/Services."

      # ── LoadBalancer (NLB/ALB) drain ──────────────────────────────────
      - name: Render and run load balancer drain script
        if: steps.reachable.outputs.ok == 'true'
        id: drain_lb
        continue-on-error: true
        run: |
          sed \
            -e "s|^export KUBECONFIG=.*|# KUBECONFIG left at its default|" \
            -e "s|^AWS_REGION=\$(curl.*|AWS_REGION=\"${{ inputs.aws_region }}\"|" \
            -e "s|__CLUSTER_NAME__|${{ steps.cluster.outputs.name }}|g" \
            ../../.github/scripts/drain-loadbalancers.sh.tpl > /tmp/drain-loadbalancers.sh
          chmod +x /tmp/drain-loadbalancers.sh
          /tmp/drain-loadbalancers.sh

      - name: Warn if load balancer drain did not complete cleanly
        if: steps.drain_lb.outcome == 'failure'
        run: |
          echo "::warning::Load balancer drain script failed - some NLBs/ALBs may not have been released cleanly. \
          Check the AWS Console (ELBv2) for leftover load balancers tagged \
          kubernetes.io/cluster/${{ steps.cluster.outputs.name }}=owned after this run."

      # ── PVC drain ──────────────────────────────────────────────────────
      - name: Render and run PVC drain script
        if: steps.reachable.outputs.ok == 'true'
        id: drain_pvcs
        continue-on-error: true
        run: |
          sed \
            -e "s|^export KUBECONFIG=.*|# KUBECONFIG left at its default|" \
            ../../.github/scripts/drain-pvcs.sh.tpl > /tmp/drain-pvcs.sh
          chmod +x /tmp/drain-pvcs.sh
          /tmp/drain-pvcs.sh

      - name: Warn if PVC drain did not complete cleanly
        if: steps.drain_pvcs.outcome == 'failure'
        run: |
          echo "::warning::PVC drain script failed - some volumes may not have been released cleanly. \
          Check the AWS Console for leftover volumes tagged ebs.csi.aws.com/cluster=true after this run."

      # ── Karpenter node drain ──────────────────────────────────────────
      # Must run LAST - the load-balancer and PVC drains above still need
      # live worker nodes (CCM/CSI-driver pods) to release their AWS-side
      # resources cleanly.
      - name: Render and run Karpenter node drain script
        if: inputs.has_karpenter && steps.reachable.outputs.ok == 'true'
        id: drain_karpenter
        continue-on-error: true
        run: |
          sed \
            -e "s|^export KUBECONFIG=.*|# KUBECONFIG left at its default|" \
            -e "s|^AWS_REGION=\$(curl.*|AWS_REGION=\"${{ inputs.aws_region }}\"|" \
            -e "s|__CLUSTER_NAME__|${{ steps.cluster.outputs.name }}|g" \
            ../../.github/scripts/drain-karpenter-nodes.sh.tpl > /tmp/drain-karpenter-nodes.sh
          chmod +x /tmp/drain-karpenter-nodes.sh
          /tmp/drain-karpenter-nodes.sh

      - name: Warn if Karpenter node drain did not complete cleanly
        if: inputs.has_karpenter && steps.drain_karpenter.outcome == 'failure'
        run: |
          echo "::warning::Karpenter node drain script failed - some worker instances may still be running. \
          terraform destroy may fail deleting the VPC/security groups if any ENI is still attached. \
          Check the AWS Console (EC2) for instances tagged kubernetes.io/cluster/${{ steps.cluster.outputs.name }}=owned."
