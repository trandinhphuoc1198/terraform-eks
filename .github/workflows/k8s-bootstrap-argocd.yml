name: k8s-bootstrap-argocd

# Hub only - installs Argo CD via helm, run directly against the cluster's
# API server (aws eks update-kubeconfig), replacing the old SSM
# send-command path entirely. .github/scripts/bootstrap-argocd.sh.tpl is
# reused UNCHANGED - it was already pure kubectl/helm with no
# instance-specific logic, it just used to run on the master over SSM. The
# only thing that changes is where it runs (this GitHub runner) and how
# kubectl gets pointed at the cluster (aws eks update-kubeconfig writes to
# the default ~/.kube/config, so the script's own
# `export KUBECONFIG=/home/ec2-user/.kube/config` line must be dropped -
# see the sed substitution below, which now blanks that line instead of
# templating it).

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      aws_region:
        type: string
        required: true
      argocd_namespace:
        type: string
        default: "argocd"
      argocd_chart_version:
        type: string
        default: "10.1.1"
      gitops_repo_raw_url:
        type: string
        required: true
      env_name:
        description: "Full env value, e.g. hub-dev - must match live/hub's var.env"
        type: string
        required: true
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap-argocd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live/hub
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.0"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.2

      - name: terraform init
        run: terraform init -backend-config="envs/${{ inputs.environment }}/backend.hcl"

      - name: Capture cluster name
        id: cluster
        run: echo "name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"

      - name: Connect kubectl to the hub cluster
        uses: ./.github/actions/eks-connect
        with:
          cluster-name: ${{ steps.cluster.outputs.name }}
          aws-region: ${{ inputs.aws_region }}

      - name: Render Argo CD bootstrap script
        working-directory: .
        run: |
          sed \
            -e "s|^export KUBECONFIG=.*|# KUBECONFIG left at its default (~/.kube/config) - already pointed at the cluster by aws eks update-kubeconfig|" \
            -e "s|__ARGOCD_NAMESPACE__|${{ inputs.argocd_namespace }}|g" \
            -e "s|__ARGOCD_CHART_VERSION__|${{ inputs.argocd_chart_version }}|g" \
            -e "s|__GITOPS_REPO_RAW_URL__|${{ inputs.gitops_repo_raw_url }}|g" \
            -e "s|__ENV__|${{ inputs.env_name }}|g" \
            .github/scripts/bootstrap-argocd.sh.tpl > /tmp/bootstrap-argocd.sh
          chmod +x /tmp/bootstrap-argocd.sh

      - name: Install Argo CD
        run: /tmp/bootstrap-argocd.sh
