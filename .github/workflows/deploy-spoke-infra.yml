name: deploy-spoke-infra

# Spoke infra ONLY: terraform apply (EKS cluster + platform Managed Node
# Group + Karpenter node role), CNI reachability check, and pushing the
# argocd-manager registration token to Secrets Manager. Deliberately stops
# there - see deploy-spoke.yml for the full chain including verification.
#
# CHANGED from the kubeadm version: the register-with-hub-spoke job no
# longer passes a `cluster_name` input - k8s-register-with-hub.yml now
# re-derives it itself via `terraform output -raw cluster_name` (it already
# needs to re-run `terraform init` to connect kubectl to the cluster, so
# there was no reason to thread the value through as a separate input).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which envs/<environment> folder to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      spoke_dir:
        description: "Path to the spoke root to operate on"
        required: false
        type: string
        default: "live/spoke"
      cluster_role:
        description: "Label value for cluster-role, e.g. workload"
        required: true
        type: string
        default: "workload"
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      spoke_dir:
        type: string
        default: "live/spoke"
      cluster_role:
        type: string
        default: "workload"
    outputs:
      cluster_name:
        description: "cluster_name output of the spoke's terraform root - needed by verify-spoke-registration.yml"
        value: ${{ jobs.deploy-spoke.outputs.terraform_output_value }}
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  # ── 1. spoke terraform apply ─────────────────────────────────────────────
  deploy-spoke:
    name: "spoke infra (${{ inputs.spoke_dir }}, ${{ inputs.environment }})"
    uses: ./.github/workflows/terraform-apply.yml
    with:
      working_directory: ${{ inputs.spoke_dir }}
      environment: ${{ inputs.environment }}
      extra_tf_vars: "network_state_key=global/network/${{ inputs.environment }}/terraform.tfstate"
      terraform_output_name: cluster_name
      aws_region: ap-northeast-1
    secrets:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

  # ── 2. verify the spoke's apiserver is reachable ─────────────────────────
  # CNI itself is installed later by the hub's ArgoCD once registration
  # completes (step 3) - this just confirms the control plane is up.
  bootstrap-cluster-spoke:
    name: "bootstrap cluster (spoke, ${{ inputs.environment }})"
    needs: deploy-spoke
    uses: ./.github/workflows/k8s-cluster-bootstrap.yml
    with:
      working_directory: ${{ inputs.spoke_dir }}
      environment: ${{ inputs.environment }}
      aws_region: ${{ vars.AWS_REGION }}
      wait_for_nodes: true
    secrets: inherit

  # ── 3. push argocd-manager token to Secrets Manager + schedule rotation ──
  register-with-hub-spoke:
    name: "register spoke with hub (secrets manager) - ${{ inputs.environment }}"
    needs: [bootstrap-cluster-spoke, deploy-spoke]
    uses: ./.github/workflows/k8s-register-with-hub.yml
    with:
      working_directory: ${{ inputs.spoke_dir }}
      environment: ${{ inputs.environment }}
      aws_region: ${{ vars.AWS_REGION }}
      cluster_role: ${{ inputs.cluster_role }}
      env_name: spoke-${{ inputs.environment }}
    secrets: inherit
