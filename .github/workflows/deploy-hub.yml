name: deploy-hub

# Deploys/updates the hub cluster ONLY: live/hub terraform apply (now
# creates an EKS cluster + platform Managed Node Group instead of a master
# EC2 instance + ASG), Cilium/CCM bootstrap, then Argo CD install. Does not
# touch live/spoke and does not re-apply global/network.
#
# k8s-cluster-bootstrap.yml and k8s-bootstrap-argocd.yml's CALL INTERFACE
# here is unchanged from the kubeadm version - only their internals changed
# (aws eks update-kubeconfig instead of SSM send-command). What DID change
# in this file: terraform_output_name/outputs, so deploy-all.yml can pass
# this cluster's real EKS name to verify-spoke-registration.yml without
# re-deriving it from a naming convention.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which envs/<environment> folder to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        required: true
    outputs:
      cluster_name:
        description: "Hub's EKS cluster name - needed by verify-spoke-registration.yml / k8s-deregister-from-hub.yml"
        value: ${{ jobs.deploy-hub.outputs.terraform_output_value }}

permissions:
  id-token: write
  contents: read

jobs:
  # ── 1. live/hub terraform apply - now installs Cilium/CCM inline via
  #      helm_release before the node group is even created, so nodes join
  #      Ready and there's no more separate CI bootstrap job for CNI ──────
  deploy-hub:
    name: "hub infra (${{ inputs.environment }})"
    uses: ./.github/workflows/terraform-apply.yml
    with:
      working_directory: live/hub
      environment: ${{ inputs.environment }}
      extra_tf_vars: "network_state_key=global/network/${{ inputs.environment }}/terraform.tfstate"
      terraform_output_name: cluster_name
      aws_region: us-east-1
    secrets:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

  # ── 2. Sanity check nodes are actually Ready before Argo CD installs ────
  bootstrap-cluster-hub:
    name: "verify nodes ready (hub, ${{ inputs.environment }})"
    needs: deploy-hub
    uses: ./.github/workflows/k8s-cluster-bootstrap.yml
    with:
      working_directory: live/hub
      environment: ${{ inputs.environment }}
      aws_region: ${{ vars.AWS_REGION }}
      wait_for_nodes: true
    secrets: inherit

  # ── 3. Argo CD install (hub only, one-time/idempotent) ──────────────────
  bootstrap-argocd:
    name: "bootstrap argo cd (${{ inputs.environment }})"
    needs: bootstrap-cluster-hub
    uses: ./.github/workflows/k8s-bootstrap-argocd.yml
    with:
      environment: ${{ inputs.environment }}
      aws_region: ${{ vars.AWS_REGION }}
      env_name: hub-${{ inputs.environment }}
      argocd_chart_version: ${{ vars.ARGOCD_CHART_VERSION }}
      gitops_repo_raw_url: https://raw.githubusercontent.com/trandinhphuoc1198/argocd-eks/main
    secrets: inherit