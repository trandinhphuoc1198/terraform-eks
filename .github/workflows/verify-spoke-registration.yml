name: verify-spoke-registration

# Terraform/CI's job stops at pushing {name, role, server, token, caData} to
# Secrets Manager (see k8s-register-with-hub.yml) - that's the one thing
# only CI can produce. Registering the cluster with ArgoCD is a GitOps fact:
# add argocd/clusters/<name>.yaml to the gitops repo once (copy an existing
# spoke file, rename) and ESO + root-clusters do the rest, no CI step
# needed on every deploy.
#
# What THIS workflow does: waits for that pipeline to actually finish and
# fails the job loudly if it hasn't, instead of silently assuming ESO will
# get there eventually.
#
# EKS REWRITE: this used to locate the hub's EC2 master by its Name tag and
# poll via `aws ssm send-command`. There is no master instance anymore - the
# hub is an EKS cluster. This now locates the hub's EKS cluster by its `Env`
# tag (the same tag modules/eks stamps on every cluster it creates -
# `tags = { Env = var.env, ... }`), connects kubectl to it directly via
# `aws eks update-kubeconfig`, and polls the registration Secret with a
# plain `kubectl get`. The CI role behind ARGOCD_REGISTRATION_ROLE_ARN
# already holds an EKS access entry + AmazonEKSAdminPolicy on the hub
# cluster (live/hub/main.tf's `aws_eks_access_entry.ci` /
# `argocd_registration_ci`) - no new IAM/Terraform changes needed, same as
# before, just a different mechanism (access entry, not an SSM IAM grant).
#
# Verification still filters directly on the cluster-name label, which the
# ExternalSecret templates from the pushed secret's own "name" field - no
# role-list + grep round trip.

on:
  workflow_dispatch:
    inputs:
      spoke_cluster_name:
        description: "Must match cluster_name in that spoke's tfvars, e.g. spoke-dev-k8s"
        required: true
      hub_env:
        description: "Hub's `env` tfvar, e.g. hub-dev - used to locate the hub's EKS cluster by its Env tag"
        required: true
        default: "hub-dev"
      cluster_role:
        description: "Informational only now - surfaced in the timeout error message. Verification itself filters by cluster-name, not cluster-role."
        required: false
        default: "workload"
      cluster_env:
        description: "Optional - informational only, surfaced in the timeout error message"
        required: false
        default: ""
      timeout_minutes:
        description: "How long to wait for ESO to materialize the registration Secret (ESO refreshInterval is 5m)"
        required: false
        default: "10"
  workflow_call:
    inputs:
      spoke_cluster_name:
        type: string
        required: true
      hub_env:
        type: string
        required: true
      cluster_role:
        type: string
        default: "workload"
      cluster_env:
        type: string
        default: ""
      timeout_minutes:
        type: string
        default: "10"
    secrets:
      ARGOCD_REGISTRATION_ROLE_ARN:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  verify-registration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.ARGOCD_REGISTRATION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Confirm credentials landed in Secrets Manager
        run: |
          aws secretsmanager describe-secret \
            --secret-id "argocd-clusters/${{ inputs.spoke_cluster_name }}" \
            --query "Name" --output text

      # Replaces "Locate hub master instance" (EC2 describe-instances by
      # Name tag). Every EKS cluster this repo creates is tagged
      # `Env = var.env` (modules/eks/main.tf) - the exact analog of the old
      # master's `Name = ${env}-k8s-master` tag, just one level up (cluster,
      # not instance).
      - name: Locate hub EKS cluster
        id: hub_cluster
        run: |
          NAME=""
          for c in $(aws eks list-clusters --query "clusters" --output text); do
            ENV_TAG=$(aws eks describe-cluster --name "$c" --query "cluster.tags.Env" --output text 2>/dev/null || echo "None")
            if [ "$ENV_TAG" = "${{ inputs.hub_env }}" ]; then
              NAME="$c"
              break
            fi
          done

          if [ -z "$NAME" ]; then
            echo "::error::No EKS cluster found tagged Env=${{ inputs.hub_env }}. Has live/hub been applied for this environment?"
            exit 1
          fi
          echo "Resolved hub EKS cluster: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Connect kubectl to the hub cluster
        uses: ./.github/actions/eks-connect
        with:
          cluster-name: ${{ steps.hub_cluster.outputs.name }}
          aws-region: ${{ vars.AWS_REGION }}

      # Polls directly instead of over SSM send-command/get-command-invocation -
      # the runner already has a live kubeconfig pointed at the hub, no
      # per-poll command dispatch needed.
      - name: Wait for ESO to materialize the cluster registration Secret
        run: |
          DEADLINE=$(( $(date +%s) + ${{ inputs.timeout_minutes }} * 60 ))
          while true; do
            OUT=$(kubectl -n argocd get secret \
              -l "argocd.argoproj.io/secret-type=cluster,cluster-name=${{ inputs.spoke_cluster_name }}" \
              --no-headers 2>/dev/null || true)

            if [ -n "$(echo "$OUT" | tr -d '[:space:]')" ]; then
              echo "Registration confirmed:"
              echo "$OUT"
              exit 0
            fi

            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::Timed out waiting for ESO/root-clusters to register ${{ inputs.spoke_cluster_name }} (label cluster-name=${{ inputs.spoke_cluster_name }}, expected role=${{ inputs.cluster_role }}, env=${{ inputs.cluster_env }}). Check: 1) is argocd/clusters/${{ inputs.spoke_cluster_name }}.yaml committed to the gitops repo? 2) did root-clusters sync? 3) does the ClusterSecretStore's aws-creds secret have SecretsManager read access? 4) does the pushed secret in Secrets Manager actually contain a 'name' field matching '${{ inputs.spoke_cluster_name }}'?"
              exit 1
            fi

            echo "Not registered yet, retrying in 30s..."
            sleep 30
          done