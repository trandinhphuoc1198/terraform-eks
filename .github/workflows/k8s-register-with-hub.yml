name: k8s-register-with-hub

# Spoke only. Creates the argocd-manager ServiceAccount on the spoke and
# pushes its token to Secrets Manager, run directly against the spoke's API
# server instead of via SSM send-command.
#
# ROTATION REDESIGN: the kubeadm version installed a systemd timer ON THE
# SPOKE MASTER to re-push a fresh token every 30 days
# (register-with-hub.sh.tpl's ROTATE heredoc). There is no persistent host
# to install that timer on anymore. This workflow is now ALSO triggered on
# a schedule (see the `schedule` trigger below) so the rotation runs as a
# GitHub Actions cron job instead of a host-level timer - same effect,
# different execution environment. If you'd rather not grant a scheduled
# workflow standing AWS credentials, replace this with a token minted with
# a longer duration and accept manual rotation instead.
#
# BUGFIX: the registration Secret pushed here MUST be keyed by the same
# cluster identifier that (a) the CI IAM role's Secrets Manager resource
# policy is scoped to (live/spoke/main.tf: argocd-clusters/${var.cluster_name}-*)
# and (b) verify-spoke-registration.yml / k8s-deregister-from-hub.yml poll
# and delete by (var.cluster_name, e.g. "spoke-dev-k8s"). This step
# previously used the separate `env_name` input (e.g. "spoke-dev") to name
# the pushed secret and the payload's "name" field - a different string
# from var.cluster_name. That mismatch caused two failures: the IAM policy
# denied the push (wrong resource pattern), and even if it hadn't,
# verify-spoke-registration.yml would poll for a cluster-name label that
# never matched what was actually pushed. Fixed below by using the real
# EKS cluster name (steps.cluster.outputs.name, i.e. terraform output
# cluster_name) as CLUSTER_NAME. `env_name` is kept as an input for
# backward compatibility with existing callers and is now only used as an
# informational tag on the secret.

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Path to the spoke root, e.g. live/spoke or live/spoke-2"
        type: string
        default: "live/spoke"
      environment:
        type: string
        required: true
      aws_region:
        type: string
        required: true
      cluster_role:
        description: "Value stamped into the pushed secret's 'role' field - must match the ApplicationSets' cluster generator selector"
        type: string
        default: "workload"
      env_name:
        description: "Informational only now (e.g. spoke-dev) - stamped as an 'Environment' tag on the pushed secret. The secret's identity/name comes from the real EKS cluster_name, not this value - see BUGFIX note above."
        type: string
        required: true
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  register-with-hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.0"

      - name: terraform init
        run: terraform init -backend-config="envs/${{ inputs.environment }}/backend.hcl"

      - name: Capture cluster name
        id: cluster
        run: echo "name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"

      - name: Connect kubectl to the spoke cluster
        uses: ./.github/actions/eks-connect
        with:
          cluster-name: ${{ steps.cluster.outputs.name }}
          aws-region: ${{ inputs.aws_region }}

      # Same argocd-manager SA/ClusterRoleBinding shape as before -
      # register-with-hub.sh.tpl's "Creating argocd-manager service account"
      # step, just run inline here instead of a separate templated script
      # (nothing in it was master-specific to begin with).
      - name: Create argocd-manager service account
        run: |
          kubectl create namespace argocd-manager --dry-run=client -o yaml | kubectl apply -f -
          kubectl create serviceaccount argocd-manager -n argocd-manager --dry-run=client -o yaml | kubectl apply -f -
          kubectl create clusterrolebinding argocd-manager-binding \
            --clusterrole=cluster-admin \
            --serviceaccount=argocd-manager:argocd-manager \
            --dry-run=client -o yaml | kubectl apply -f -

      # Mints a token, reads the cluster CA + real API endpoint straight
      # from kubeconfig (populated by aws eks update-kubeconfig, so this is
      # the EKS endpoint), and pushes {name, role, server, token, caData} to
      # Secrets Manager under the REAL cluster name (steps.cluster.outputs.name)
      # - not inputs.env_name. This is what verify-spoke-registration.yml's
      # ExternalSecret-derived cluster-name label is matched against, and
      # what live/spoke/main.tf's IAM resource pattern
      # (argocd-clusters/${var.cluster_name}-*) actually authorizes.
      - name: Push registration to Secrets Manager
        env:
          CLUSTER_NAME: ${{ steps.cluster.outputs.name }}
          CLUSTER_ROLE: ${{ inputs.cluster_role }}
          ENV_NAME: ${{ inputs.env_name }}
        run: |
          set -euo pipefail
          TOKEN=$(kubectl create token argocd-manager -n argocd-manager --duration=2160h)
          CA_DATA=$(kubectl config view --raw --minify --flatten -o jsonpath='{.clusters[0].cluster.certificate-authority-data}')
          SERVER_URL=$(kubectl config view --raw --minify --flatten -o jsonpath='{.clusters[0].cluster.server}')
          SECRET_NAME="argocd-clusters/${CLUSTER_NAME}"

          PAYLOAD=$(jq -n \
            --arg name "$CLUSTER_NAME" \
            --arg role "$CLUSTER_ROLE" \
            --arg server "$SERVER_URL" \
            --arg token "$TOKEN" \
            --arg ca "$CA_DATA" \
            '{name:$name, role:$role, server:$server, token:$token, caData:$ca}')

          aws secretsmanager put-secret-value \
            --secret-id "$SECRET_NAME" \
            --secret-string "$PAYLOAD" \
            --region "${{ inputs.aws_region }}" 2>/dev/null || \
          aws secretsmanager create-secret \
            --name "$SECRET_NAME" \
            --secret-string "$PAYLOAD" \
            --tags Key=ManagedBy,Value=github-actions Key=ClusterName,Value="$CLUSTER_NAME" Key=ClusterRole,Value="$CLUSTER_ROLE" Key=Environment,Value="$ENV_NAME" Key=Purpose,Value=argocd-registration \
            --region "${{ inputs.aws_region }}"