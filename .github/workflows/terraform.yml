name: terraform-ci

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/*.pkr.hcl"
      - ".tflint.hcl"
      - ".github/workflows/terraform.yml"
  push:
  workflow_dispatch:

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.0"
      - name: terraform fmt (check only, no changes)
        run: terraform fmt -recursive -check -diff

  # validate + tflint run per-root, since each root has its own providers/
  # backend and `terraform validate` needs an `init` first. global/network
  # and each live/* directory are validated independently.
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [global/network, live/hub, live/spoke]
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.0"

      # backend=false: this job never needs real AWS credentials or state,
      # it only checks that the config is internally consistent.
      - name: terraform init (no backend)
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.root }}
        run: terraform validate

  tflint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [global/network, live/hub, live/spoke]
    steps:
      - uses: actions/checkout@v5
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.53.0"
          
      - name: tflint init
        run: tflint --init --config ${{ github.workspace }}/.tflint.hcl
        working-directory: ${{ matrix.root }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: tflint run
        run: tflint --config ${{ github.workspace }}/.tflint.hcl
        working-directory: ${{ matrix.root }}

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          
