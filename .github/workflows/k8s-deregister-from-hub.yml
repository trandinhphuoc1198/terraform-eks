name: k8s-deregister-from-hub

# Spoke only. Temporarily removes a spoke cluster from ArgoCD's LIVE
# inventory before any infra teardown happens, so there is no window in
# which ArgoCD's selfHeal could recreate a workload while destroy-spoke's
# PVC drain step is running.
#
# TEMPORARY BY DESIGN - this never touches git. It deletes the spoke's
# ArgoCD Applications and its ExternalSecret/Secret directly on the hub
# cluster. root-clusters (an ArgoCD Application with selfHeal: true
# watching argocd/clusters/) will recreate the ExternalSecret from git on
# its own next reconcile (default ~3 min) - that's expected and harmless
# here: by the time it does, the spoke cluster this workflow is tearing
# down is either already gone or mid-destroy, so there's nothing left for
# ArgoCD to actually schedule anything onto. If you want a PERMANENT
# deregistration instead (e.g. retiring a spoke for good), delete
# argocd/clusters/<cluster_name>.yaml from the gitops repo yourself - that
# is a deliberate, separate action from this workflow.
#
# All of .github/scripts/deregister-from-hub.sh.tpl's own logic (ordering,
# race-freedom guarantees, excluded releases, etc.) is UNCHANGED - see that
# script's header comment for the full rationale. Nothing about the
# deregistration mechanic itself is EKS-specific; only how this workflow
# gets kubectl pointed at the hub cluster changed.
#
# EKS REWRITE: this used to locate the hub's EC2 master by its Name tag and
# run the script over `aws ssm send-command`. There is no master instance
# anymore. This now locates the hub's EKS cluster by its `Env` tag (same
# convention as verify-spoke-registration.yml - see that file's comment),
# connects kubectl directly via `aws eks update-kubeconfig`, and runs the
# script as a normal shell step on the runner instead of dispatching it
# over SSM. The script's own `export KUBECONFIG=/home/ec2-user/.kube/config`
# line is blanked out at render time (same sed pattern drain-cluster.yml
# already uses for its four scripts) so it picks up the default kubeconfig
# `aws eks update-kubeconfig` just wrote.
#
# Reuses the ARGOCD_REGISTRATION_ROLE_ARN role already granted in
# live/hub/main.tf (argocd_registration_ci) - that role already holds an
# EKS access entry + AmazonEKSAdminPolicy on the hub cluster, so no new
# IAM/Terraform changes are needed. What actually happens on the hub
# (kubectl delete applications/externalsecrets/secrets) is governed by
# that access entry's cluster-admin grant, not by anything SSM-related.
#
# This intentionally does NOT tolerate failure: if deregistration can't be
# confirmed, the job fails rather than letting the destroy pipeline proceed
# into a drain step that might still be racing ArgoCD.

on:
  workflow_call:
    inputs:
      spoke_dir:
        description: "Path to the spoke root, e.g. live/spoke or live/spoke-2"
        type: string
        default: "live/spoke"
      environment:
        description: "envs/<environment> folder to read cluster_name from"
        type: string
        required: true
      hub_env:
        description: "Hub's `env` tfvar, e.g. hub-dev - used to locate the hub's EKS cluster by its Env tag"
        type: string
        required: true
      aws_region:
        type: string
        required: true
    secrets:
      ARGOCD_REGISTRATION_ROLE_ARN:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deregister:
    name: "deregister from hub argocd (${{ inputs.spoke_dir }}, ${{ inputs.environment }})"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read cluster_name from tfvars
        id: cluster
        working-directory: ${{ inputs.spoke_dir }}
        run: |
          NAME=$(grep -E '^cluster_name' "envs/${{ inputs.environment }}/terraform.tfvars" | cut -d'"' -f2)
          if [ -z "$NAME" ]; then
            echo "::error::Could not read cluster_name from ${{ inputs.spoke_dir }}/envs/${{ inputs.environment }}/terraform.tfvars"
            exit 1
          fi
          echo "Resolved cluster_name: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.ARGOCD_REGISTRATION_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      # Same lookup as verify-spoke-registration.yml - see that file's
      # comment for why this replaces "locate hub master instance by Name tag".
      - name: Locate hub EKS cluster
        id: hub_cluster
        run: |
          NAME=""
          for c in $(aws eks list-clusters --query "clusters" --output text); do
            ENV_TAG=$(aws eks describe-cluster --name "$c" --query "cluster.tags.Env" --output text 2>/dev/null || echo "None")
            if [ "$ENV_TAG" = "${{ inputs.hub_env }}" ]; then
              NAME="$c"
              break
            fi
          done

          if [ -z "$NAME" ]; then
            echo "::error::No EKS cluster found tagged Env=${{ inputs.hub_env }}. Has live/hub been applied for this environment?"
            exit 1
          fi
          echo "Resolved hub EKS cluster: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Connect kubectl to the hub cluster
        uses: ./.github/actions/eks-connect
        with:
          cluster-name: ${{ steps.hub_cluster.outputs.name }}
          aws-region: ${{ inputs.aws_region }}

      - name: Render deregistration script
        run: |
          sed \
            -e "s|^export KUBECONFIG=.*|# KUBECONFIG left at its default (~/.kube/config) - already pointed at the hub cluster by aws eks update-kubeconfig|" \
            -e "s|__CLUSTER_NAME__|${{ steps.cluster.outputs.name }}|g" \
            .github/scripts/deregister-from-hub.sh.tpl > /tmp/deregister-from-hub.sh
          chmod +x /tmp/deregister-from-hub.sh

      - name: Deregister spoke from ArgoCD (blocks until fully confirmed gone)
        run: /tmp/deregister-from-hub.sh

      - name: Explain failure
        if: failure()
        run: echo "::error::Deregistration ended in failure - the cluster may still be tracked by ArgoCD. Not safe to proceed with destroy."