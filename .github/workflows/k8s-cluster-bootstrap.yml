name: k8s-cluster-bootstrap

# Confirms the cluster's API server is reachable and (hub only) that nodes
# have reached Ready. CNI/CCM installation moved into Terraform itself
# (live/hub/main.tf's helm_release.cilium / helm_release.aws_ccm) so the
# dependency on the node group is enforced by Terraform's own graph instead
# of by CI job ordering - see PR: node group + coredns addon hanging forever
# because this workflow used to install Cilium in a job that only ran AFTER
# the node group had already been created (and was stuck NotReady with no
# CNI at all).

on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        required: true
      environment:
        type: string
        required: true
      aws_region:
        type: string
        required: true
      wait_for_nodes:
        description: "true for hub (nodes should already be Ready - Cilium was installed by Terraform before the node group existed), false for spoke (nodes stay NotReady until the hub's ArgoCD installs Cilium after registration)"
        type: boolean
        default: true
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.0"

      - name: terraform init
        run: terraform init -backend-config="envs/${{ inputs.environment }}/backend.hcl"

      - name: Capture cluster name
        id: cluster
        run: echo "name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"

      - name: Connect kubectl to the cluster
        uses: ./.github/actions/eks-connect
        with:
          cluster-name: ${{ steps.cluster.outputs.name }}
          aws-region: ${{ inputs.aws_region }}

      - name: Wait for nodes to become Ready (hub only - Cilium already installed by Terraform)
        if: inputs.wait_for_nodes
        run: kubectl wait node --all --for=condition=Ready --timeout=180s

      - name: Verify apiserver is reachable (spoke - nodes stay NotReady until hub's ArgoCD installs Cilium after registration)
        if: ${{ !inputs.wait_for_nodes }}
        run: kubectl get --raw='/readyz'